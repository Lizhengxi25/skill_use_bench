# search-env rollout — WITH-SKILL condition. codex / gpt-5.5 / reasoning=medium.
# Rollout-only (no rubrics): run with `--only rollout`.
#   uv run python3 skillsbench_x/run_experiment.py \
#     --config experiments/configs/search-env/medium/codex-gpt5_5-medium-withskill.yaml --only rollout

name: search-env
tasks_root: tasks_runtime/search-env   # converter output (107 curated tasks)
runs_root:  runs               # -> .../search-env-codex-with-medium/

# Pre-query prompt for the WITH-SKILL condition (sent verbatim before each query;
# may differ from the other condition). NOT the OpenAI system prompt.
prompt_file: experiments/configs/search-env/prompt-withskill.md

run_id_template: "{name}-{harness}-{skills}-{reasoning}"     # -> search-env-codex-with-medium

matrix:
  - { harness: codex, model: gpt-5.5, reasoning: medium, with_skills: true }

rollout:
  concurrency: 8
  capture_workspace: true   # snapshot each agent's /app -> runs/<run>/<task>/workspace.tgz
  skip_verify: true         # rollout-only: skip benchflow verify (no real verifier; avoids harden find/ 10s timeout)
  bench_extra_args: ["--sandbox-user", "none"]

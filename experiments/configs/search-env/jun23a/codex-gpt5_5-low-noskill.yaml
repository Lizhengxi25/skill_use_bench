# search-env-jun23a rollout — NO-SKILL condition. codex / gpt-5.5 / reasoning=low.
# The 83 jun_23_syn_100_a_data A+B tasks (dedicated tasks_root). Rollout-only (no rubrics): use `--only rollout`.
#   uv run python3 skillsbench_x/run_experiment.py \
#     --config experiments/configs/search-env/jun23a/codex-gpt5_5-low-noskill.yaml --only rollout

name: search-env-jun23a
tasks_root: tasks_runtime/search-env-jun23a   # the 83 A+B tasks (dedicated dir)
runs_root:  runs               # -> .../search-env-jun23a-codex-no-low/

# Pre-query prompt for the NO-SKILL condition (sent verbatim before each query). Shared with the
# search-env set; NOT the OpenAI system prompt.
prompt_file: experiments/configs/search-env/prompt-noskill.md

run_id_template: "{name}-{harness}-{skills}-{reasoning}"     # -> search-env-jun23a-codex-no-low

matrix:
  - { harness: codex, model: gpt-5.5, reasoning: low, with_skills: false }

rollout:
  concurrency: 10
  capture_workspace: true   # snapshot each agent's /app -> runs/<run>/<task>/workspace.tgz
  skip_verify: true         # rollout-only: skip benchflow verify (no real verifier)
  bench_extra_args: ["--sandbox-user", "none"]

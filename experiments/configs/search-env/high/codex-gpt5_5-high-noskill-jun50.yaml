# jun50 rollout — NEW jun_16_syn_50_data set (31 A+B tasks) — NO-SKILL. codex / gpt-5.5 / reasoning=high.
# Rollout-only (no rubrics): run with `--only rollout`.
#   uv run python3 skillsbench_x/run_experiment.py \
#     --config experiments/configs/search-env/high/codex-gpt5_5-high-noskill-jun50.yaml --only rollout

name: jun50
tasks_root: tasks_runtime/jun_16_syn_50_data   # new data: 31 A+B tasks
runs_root:  runs                       # -> .../jun50-codex-no-high/

# Pre-query prompt for the NO-SKILL condition (sent verbatim before each query;
# may differ from the other condition). NOT the OpenAI system prompt.
prompt_file: experiments/configs/search-env/prompt-noskill.md

run_id_template: "{name}-{harness}-{skills}-{reasoning}"           # -> jun50-codex-no-high

matrix:
  - { harness: codex, model: gpt-5.5, reasoning: high, with_skills: false }

rollout:
  concurrency: 10
  capture_workspace: true   # snapshot each agent's /app -> runs/<run>/<task>/workspace.tgz
  skip_verify: true         # rollout-only: skip benchflow verify (no real verifier; avoids harden find/ 10s timeout)
  bench_extra_args: ["--sandbox-user", "none"]

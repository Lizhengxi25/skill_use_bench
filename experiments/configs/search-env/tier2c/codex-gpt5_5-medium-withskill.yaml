# search-env-tier2c rollout — WITH-SKILL condition. codex / gpt-5.5 / reasoning=medium.
# The 16 harder Tier-2 / C-class tasks (toolchain images). Rollout-only (no rubrics): use `--only rollout`.
#   uv run python3 skillsbench_x/run_experiment.py \
#     --config experiments/configs/search-env/tier2c/codex-gpt5_5-medium-withskill.yaml --only rollout

name: search-env-tier2c
tasks_root: tasks_runtime/search-env-tier2c   # the 16 Tier-2 + C-class tasks (dedicated dir)
runs_root:  runs               # -> .../search-env-tier2c-codex-with-medium/

# Pre-query prompt for the WITH-SKILL condition (sent verbatim before each query). Shared with the
# 107-task set; NOT the OpenAI system prompt.
prompt_file: experiments/configs/search-env/prompt-withskill.md

run_id_template: "{name}-{harness}-{skills}-{reasoning}"     # -> search-env-tier2c-codex-with-medium

matrix:
  - { harness: codex, model: gpt-5.5, reasoning: medium, with_skills: true }

rollout:
  concurrency: 4
  capture_workspace: true   # snapshot each agent's /app -> runs/<run>/<task>/workspace.tgz
  skip_verify: true         # rollout-only: skip benchflow verify (no real verifier)
  bench_extra_args: ["--sandbox-user", "none"]
